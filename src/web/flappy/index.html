<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sky Hop Deluxe - Natasha Arcade</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: radial-gradient(circle at 50% 10%, #20063b, #090114 60%, #000);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }
    #gameContainer {
      position: relative;
      width: 100%;
      max-width: 420px;
      height: 640px;
      border: 4px solid #ff007f;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 0 35px rgba(255, 0, 127, 0.45), inset 0 0 15px rgba(0, 245, 212, 0.3);
      background: #70c5ce;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #scoreDisplay {
      position: absolute;
      top: 25px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 48px;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 4px 0 #000, 0 0 15px #ff007f;
      z-index: 5;
      pointer-events: none;
    }
    #uiOverlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(13, 2, 31, 0.82);
      backdrop-filter: blur(6px);
      color: #fff;
      text-align: center;
      padding: 24px;
      z-index: 10;
    }
    #uiOverlay.hidden { display: none; }
    h1 {
      font-size: 32px;
      color: #ffd700;
      text-shadow: 0 3px 0 #b38600, 0 0 20px #ffea79;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }
    p { font-size: 15px; color: #e2e8f0; margin-bottom: 22px; line-height: 1.4; }
    .btn {
      background: linear-gradient(135deg, #00f5d4, #00bbf9);
      color: #001f3f;
      border: none;
      padding: 16px 36px;
      font-size: 18px;
      font-weight: 900;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 6px 0 #007799, 0 0 20px rgba(0, 245, 212, 0.6);
      transition: all 0.1s ease;
    }
    .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #007799; }
    .reward-tag {
      display: inline-block;
      margin-top: 10px;
      padding: 6px 14px;
      background: #1e0938;
      border: 1px solid #ffd700;
      border-radius: 20px;
      font-weight: bold;
      color: #ffd700;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="gameContainer">
    <div id="scoreDisplay">0</div>
    <canvas id="gameCanvas" width="360" height="560"></canvas>
    
    <div id="uiOverlay">
      <h1 id="titleText">SKY HOP DELUXE 🐥</h1>
      <p id="subText">Toque na tela ou aperte <b>ESPAÇO</b> para voar!</p>
      <div class="reward-tag" id="rewardDisplay">🪙 1 Cano = 20 NatashaCoins</div>
      <br>
      <button class="btn" id="startBtn">JOGAR AGORA 🚀</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('uiOverlay');
    const titleText = document.getElementById('titleText');
    const subText = document.getElementById('subText');
    const startBtn = document.getElementById('startBtn');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const rewardDisplay = document.getElementById('rewardDisplay');

    // Pega o ID do usuário na URL (passado pela Natasha)
    const urlParams = new URLSearchParams(window.location.search);
    const discordUserId = urlParams.get('userId') || 'guest';

    let state = 'START';
    let score = 0;
    let frames = 0;
    let particles = [];

    // Sintetizador de Som via Web Audio
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'flap') {
        osc.frequency.setValueAtTime(400, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.start(); osc.stop(audioCtx.currentTime + 0.1);
      } else if (type === 'score') {
        osc.frequency.setValueAtTime(520, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1040, audioCtx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
        osc.start(); osc.stop(audioCtx.currentTime + 0.15);
      } else if (type === 'hit') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(180, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
        osc.start(); osc.stop(audioCtx.currentTime + 0.2);
      }
    }

    // Partículas de Impacto e Ponto
    function spawnParticles(x, y, color, count = 12) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 6,
          vy: (Math.random() - 0.5) * 6,
          radius: Math.random() * 4 + 2,
          color,
          alpha: 1
        });
      }
    }

    // Piu-Piu Animado
    const bird = {
      x: 65,
      y: 220,
      radius: 15,
      velocity: 0,
      gravity: 0.26,
      jump: -5.4,
      rotation: 0,
      blinkTimer: 0,

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);

        // Sombra suave sob o pássaro
        ctx.fillStyle = 'rgba(0,0,0,0.15)';
        ctx.beginPath();
        ctx.ellipse(0, 18, 12, 4, 0, 0, Math.PI * 2);
        ctx.fill();

        // Asa com bater contínuo
        const wingAngle = state === 'PLAYING' ? Math.sin(frames * 0.35) * 0.6 : 0;
        ctx.save();
        ctx.translate(-6, 2);
        ctx.rotate(wingAngle);
        ctx.fillStyle = '#ffcf33';
        ctx.beginPath();
        ctx.ellipse(0, 0, 10, 6, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#d99b00';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.restore();

        // Corpo Redondo
        const grad = ctx.createRadialGradient(-3, -3, 2, 0, 0, this.radius);
        grad.addColorStop(0, '#fff475');
        grad.addColorStop(0.7, '#ffcc00');
        grad.addColorStop(1, '#e69900');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#b37700';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Olho
        this.blinkTimer++;
        const isBlinking = this.blinkTimer % 180 > 172;
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(7, -5, 5, 0, Math.PI * 2);
        ctx.fill();
        if (!isBlinking) {
          ctx.fillStyle = '#000';
          ctx.beginPath();
          ctx.arc(9, -5, 2.5, 0, Math.PI * 2);
          ctx.fill();
          // Brilho do olho
          ctx.fillStyle = '#fff';
          ctx.beginPath();
          ctx.arc(10, -6, 1, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.strokeStyle = '#000';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(4, -5); ctx.lineTo(10, -5);
          ctx.stroke();
        }

        // Bico Laranja com Relevo
        ctx.fillStyle = '#ff4500';
        ctx.beginPath();
        ctx.moveTo(11, -3);
        ctx.lineTo(23, 2);
        ctx.lineTo(11, 7);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = '#b33000';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        ctx.restore();
      },
      update() {
        this.velocity += this.gravity;
        this.y += this.velocity;

        if (this.velocity >= this.jump) {
          this.rotation = Math.min(Math.PI / 2.5, this.rotation + 0.06);
        } else {
          this.rotation = -0.38;
        }

        if (this.y + this.radius >= canvas.height - 60) {
          this.y = canvas.height - 60 - this.radius;
          gameOver();
        }
        if (this.y - this.radius <= 0) {
          this.y = this.radius;
          this.velocity = 0;
        }
      },
      flap() {
        this.velocity = this.jump;
        playSound('flap');
        spawnParticles(this.x - 10, this.y + 5, '#ffffff', 4);
      },
      reset() {
        this.y = 220;
        this.velocity = 0;
        this.rotation = 0;
      }
    };

    // Canos Dinâmicos com Texturas e Brilho
    const pipes = {
      position: [],
      gap: 135,
      w: 56,
      dx: 2.4,

      draw() {
        for (let i = 0; i < this.position.length; i++) {
          let p = this.position[i];
          let topY = p.y;
          let bottomY = p.y + this.gap;

          // Cano Superior
          let gradTop = ctx.createLinearGradient(p.x, 0, p.x + this.w, 0);
          gradTop.addColorStop(0, '#2ecc71');
          gradTop.addColorStop(0.3, '#a3e4d7');
          gradTop.addColorStop(0.7, '#27ae60');
          gradTop.addColorStop(1, '#1e8449');

          ctx.fillStyle = gradTop;
          ctx.fillRect(p.x, 0, this.w, topY);
          ctx.strokeStyle = '#145a32';
          ctx.lineWidth = 2.5;
          ctx.strokeRect(p.x, 0, this.w, topY);

          // Borda do Cano Superior
          ctx.fillRect(p.x - 4, topY - 24, this.w + 8, 24);
          ctx.strokeRect(p.x - 4, topY - 24, this.w + 8, 24);

          // Cano Inferior
          let gradBottom = ctx.createLinearGradient(p.x, 0, p.x + this.w, 0);
          gradBottom.addColorStop(0, '#2ecc71');
          gradBottom.addColorStop(0.3, '#a3e4d7');
          gradBottom.addColorStop(0.7, '#27ae60');
          gradBottom.addColorStop(1, '#1e8449');

          ctx.fillStyle = gradBottom;
          ctx.fillRect(p.x, bottomY, this.w, canvas.height - bottomY - 60);
          ctx.strokeRect(p.x, bottomY, this.w, canvas.height - bottomY - 60);

          // Borda do Cano Inferior
          ctx.fillRect(p.x - 4, bottomY, this.w + 8, 24);
          ctx.strokeRect(p.x - 4, bottomY, this.w + 8, 24);
        }
      },
      update() {
        if (frames % 90 === 0) {
          let maxPos = canvas.height - 60 - this.gap - 80;
          this.position.push({
            x: canvas.width,
            y: Math.floor(Math.random() * (maxPos - 60) + 60),
            passed: false
          });
        }

        for (let i = 0; i < this.position.length; i++) {
          let p = this.position[i];
          p.x -= this.dx;

          // Colisão com tolerância
          if (
            bird.x + bird.radius - 3 > p.x &&
            bird.x - bird.radius + 3 < p.x + this.w &&
            (bird.y - bird.radius + 3 < p.y || bird.y + bird.radius - 3 > p.y + this.gap)
          ) {
            gameOver();
          }

          // Ponto
          if (p.x + this.w < bird.x && !p.passed) {
            score++;
            scoreDisplay.textContent = score;
            p.passed = true;
            playSound('score');
            spawnParticles(bird.x, bird.y, '#ffd700', 16);
          }

          if (p.x + this.w < 0) {
            this.position.shift();
            i--;
          }
        }
      },
      reset() {
        this.position = [];
      }
    };

    // Fundo em Paralaxe
    let groundX = 0;
    let cloudX = 0;

    function drawParallaxBackground() {
      // Céu Degradê
      const skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
      skyGrad.addColorStop(0, '#3a88e9');
      skyGrad.addColorStop(0.7, '#70c5ce');
      skyGrad.addColorStop(1, '#dff9fb');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Nuvens Animadas
      cloudX = (cloudX - 0.4) % canvas.width;
      ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
      for (let offset = 0; offset <= canvas.width * 2; offset += canvas.width) {
        let cx = cloudX + offset;
        ctx.beginPath();
        ctx.arc(cx + 60, 110, 26, 0, Math.PI * 2);
        ctx.arc(cx + 100, 95, 36, 0, Math.PI * 2);
        ctx.arc(cx + 140, 110, 26, 0, Math.PI * 2);
        ctx.arc(cx + 260, 150, 28, 0, Math.PI * 2);
        ctx.arc(cx + 300, 135, 40, 0, Math.PI * 2);
        ctx.arc(cx + 340, 150, 28, 0, Math.PI * 2);
        ctx.fill();
      }

      // Skyline / Montanhas
      ctx.fillStyle = '#81c784';
      ctx.beginPath();
      ctx.moveTo(0, canvas.height - 60);
      for (let x = 0; x <= canvas.width; x += 60) {
        ctx.lineTo(x + 30, canvas.height - 95);
        ctx.lineTo(x + 60, canvas.height - 60);
      }
      ctx.fill();

      // Chão Animado com Grama
      groundX = (groundX - 2.4) % 24;
      ctx.fillStyle = '#ded895';
      ctx.fillRect(0, canvas.height - 60, canvas.width, 60);
      ctx.fillStyle = '#73bf2e';
      ctx.fillRect(0, canvas.height - 60, canvas.width, 14);

      // Listras de Grama
      ctx.strokeStyle = '#579e1c';
      ctx.lineWidth = 3;
      for (let x = groundX; x < canvas.width + 24; x += 18) {
        ctx.beginPath();
        ctx.moveTo(x, canvas.height - 60);
        ctx.lineTo(x + 8, canvas.height - 46);
        ctx.stroke();
      }
    }

    function renderParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= 0.03;
        if (p.alpha <= 0) {
          particles.splice(i, 1);
          continue;
        }
        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    function loop() {
      drawParallaxBackground();

      if (state === 'PLAYING') {
        pipes.update();
        bird.update();
        frames++;
      }

      pipes.draw();
      bird.draw();
      renderParticles();

      requestAnimationFrame(loop);
    }

    function startGame() {
      state = 'PLAYING';
      score = 0;
      frames = 0;
      scoreDisplay.textContent = 0;
      bird.reset();
      pipes.reset();
      particles = [];
      overlay.classList.add('hidden');
    }

    async function gameOver() {
      if (state === 'GAMEOVER') return;
      state = 'GAMEOVER';
      playSound('hit');
      spawnParticles(bird.x, bird.y, '#e74c3c', 25);

      const earnedCoins = score * 20;
      const earnedXp = score * 15;

      titleText.textContent = 'FIM DE JOGO! 💥';
      subText.innerHTML = `Você superou <b>${score} canos</b>!<br>Prêmio: 🪙 <b>+${earnedCoins} NatashaCoins</b> e ⭐ <b>+${earnedXp} XP</b>!`;
      rewardDisplay.textContent = `Salvo no seu perfil da Natasha!`;
      startBtn.textContent = 'JOGAR NOVAMENTE 🚀';
      overlay.classList.remove('hidden');

      // Envia a pontuação para a Natasha creditar automaticamente
      if (discordUserId && discordUserId !== 'guest' && score > 0) {
        try {
          await fetch('/api/score', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ userId: discordUserId, score }),
          });
        } catch (e) {}
      }
    }

    function handleAction() {
      if (state === 'PLAYING') bird.flap();
    }

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        if (state === 'PLAYING') handleAction();
        else if (!overlay.classList.contains('hidden')) startGame();
      }
    });

    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); handleAction(); }, { passive: false });
    canvas.addEventListener('mousedown', handleAction);
    startBtn.addEventListener('click', startGame);

    loop();
  </script>
</body>
</html>
