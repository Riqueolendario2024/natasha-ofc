<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Space Shooter Arcade - Natasha</title>
  <style>
    @font-face {
      font-family: 'ArcadeFont';
      src: url('/galaxy/assets/fonte/upheaval/upheavtt.ttf') format('truetype'),
           url('/galaxy/assets/fonte/m42flight721/m42.TTF') format('truetype');
      font-weight: normal;
      font-style: normal;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    body {
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'ArcadeFont', 'Courier New', monospace;
      color: #fff;
      overflow: hidden;
    }
    #cabinet {
      position: relative;
      width: 100%;
      max-width: 420px;
      height: 680px;
      border: 4px solid #00f2fe;
      border-radius: 12px;
      background: #000;
      box-shadow: 0 0 25px rgba(0, 242, 254, 0.4), inset 0 0 15px rgba(0, 242, 254, 0.2);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    /* Efeito Scanlines CRT */
    #cabinet:after {
      content: " ";
      display: block;
      position: absolute;
      inset: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
      background-size: 100% 4px;
      z-index: 15;
      pointer-events: none;
      opacity: 0.6;
    }
    #topHeader {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px 6px;
      z-index: 10;
      background: #000;
      border-bottom: 2px solid #112233;
    }
    .hud-block { text-align: center; }
    .hud-label { font-size: 13px; color: #ff0055; letter-spacing: 2px; }
    .hud-val { font-size: 18px; color: #fff; text-shadow: 0 0 8px #fff; letter-spacing: 2px; }
    .hud-high-label { font-size: 13px; color: #00f2fe; letter-spacing: 2px; }
    .hud-high-val { font-size: 18px; color: #00f2fe; text-shadow: 0 0 8px #00f2fe; letter-spacing: 2px; }
    canvas {
      flex: 1;
      display: block;
      width: 100%;
      background: #000;
      cursor: crosshair;
    }
    /* Menus e Telas */
    .screen-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.88);
      z-index: 20;
      padding: 24px;
      text-align: center;
    }
    .screen-overlay.hidden { display: none; }
    .logo-main {
      font-size: 38px;
      line-height: 1.1;
      color: #ffcc00;
      text-shadow: 3px 3px 0 #cc0000, 0 0 20px #ff3300;
      margin-bottom: 6px;
      letter-spacing: 3px;
    }
    .logo-sub {
      font-size: 32px;
      color: #00f2fe;
      text-shadow: 3px 3px 0 #0055aa, 0 0 20px #00f2fe;
      margin-bottom: 30px;
      letter-spacing: 4px;
    }
    .menu-btn {
      width: 80%;
      max-width: 260px;
      padding: 14px 10px;
      margin: 8px 0;
      background: transparent;
      border: 2px solid #00f2fe;
      border-radius: 8px;
      color: #00f2fe;
      font-family: 'ArcadeFont', monospace;
      font-size: 18px;
      letter-spacing: 2px;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(0, 242, 254, 0.2), inset 0 0 10px rgba(0, 242, 254, 0.2);
      transition: all 0.1s ease;
    }
    .menu-btn:hover, .menu-btn:active {
      background: #00f2fe;
      color: #000;
      box-shadow: 0 0 20px #00f2fe;
      transform: scale(1.03);
    }
    .insert-coin {
      margin-top: 30px;
      font-size: 14px;
      color: #00ff66;
      letter-spacing: 2px;
      animation: blinkText 0.8s steps(2) infinite;
    }
    @keyframes blinkText { 50% { opacity: 0; } }
    #footerBar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 16px;
      background: #000;
      border-top: 2px solid #112233;
      z-index: 10;
    }
    .lives-box { display: flex; gap: 6px; align-items: center; }
    .lives-box img { width: 18px; height: 18px; filter: drop-shadow(0 0 4px #ff0055); }
  </style>
</head>
<body>
  <div id="cabinet">
    <!-- Header Arcade Clássico -->
    <div id="topHeader">
      <div class="hud-block">
        <div class="hud-label">1P PONTOS</div>
        <div class="hud-val" id="scoreVal">0000</div>
      </div>
      <div class="hud-block">
        <div class="hud-high-label">RECORDE</div>
        <div class="hud-high-val" id="highScoreVal">10000</div>
      </div>
    </div>

    <!-- Tela do Jogo -->
    <canvas id="gameCanvas" width="400" height="520"></canvas>

    <!-- Rodapé com Vidas -->
    <div id="footerBar">
      <div class="lives-box" id="livesDisplay"></div>
      <div style="font-size: 11px; color: #ff007f; letter-spacing: 1px;">NATASHA ARCADE</div>
    </div>

    <!-- Menu Principal -->
    <div class="screen-overlay" id="startScreen">
      <div class="logo-main">SPACE</div>
      <div class="logo-sub">SHOOTER</div>
      <button class="menu-btn" id="playBtn">▶ JOGAR</button>
      <button class="menu-btn" id="autoFireBtn">⚡ TIRO: AUTO</button>
      <div class="insert-coin">CLIQUE EM JOGAR OU APERTE ESPAÇO</div>
    </div>

    <!-- Tela de Game Over -->
    <div class="screen-overlay hidden" id="gameOverScreen">
      <div style="font-size: 34px; color: #ff0055; text-shadow: 0 0 20px #ff0055; margin-bottom: 12px; letter-spacing: 3px;">FIM DE JOGO</div>
      <p style="font-size: 15px; color: #ccc; margin-bottom: 8px;" id="finalScoreTxt">PONTUAÇÃO: 0000</p>
      <p style="font-size: 13px; color: #00ff66; margin-bottom: 24px;" id="rewardTxt">🪙 +0 NATASHACOINS</p>
      <button class="menu-btn" id="restartBtn">TENTAR DE NOVO</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreVal = document.getElementById('scoreVal');
    const highScoreVal = document.getElementById('highScoreVal');
    const livesDisplay = document.getElementById('livesDisplay');
    const startScreen = document.getElementById('startScreen');
    const gameOverScreen = document.getElementById('gameOverScreen');
    const playBtn = document.getElementById('playBtn');
    const restartBtn = document.getElementById('restartBtn');
    const autoFireBtn = document.getElementById('autoFireBtn');
    const finalScoreTxt = document.getElementById('finalScoreTxt');
    const rewardTxt = document.getElementById('rewardTxt');

    const urlParams = new URLSearchParams(window.location.search);
    const discordUserId = urlParams.get('userId') || 'guest';

    function loadImg(src) {
      const img = new Image();
      img.src = encodeURI(src);
      return img;
    }

    // Carregamento dos Assets
    const playerShipImg = loadImg('/galaxy/assets/Naves/SpaceShip 2.png');
    const meteorLargeImg = loadImg('/galaxy/assets/Obstaculos/Meteor Red_Large.png');
    const meteorSmallImg = loadImg('/galaxy/assets/Obstaculos/Meteor Red_Small.png');
    const bgSpaceImg = loadImg('/galaxy/assets/Cenario/Space Background 5.png');
    const heartFullSrc = '/galaxy/assets/HUD/Life_Full.png';

    const explosionFrames = [];
    for (let i = 1; i <= 8; i++) {
      explosionFrames.push(loadImg(`/galaxy/assets/Explosão/Explosion 7_${i}.png`));
    }

    const bgMusic = new Audio(encodeURI('/galaxy/assets/Audio/Musica/musica tema.ogg'));
    bgMusic.loop = true; bgMusic.volume = 0.35;
    const shootSound = new Audio(encodeURI('/galaxy/assets/Audio/Efeitos sonoros/tiro.wav'));
    shootSound.volume = 0.45;
    const boomSound = new Audio(encodeURI('/galaxy/assets/Audio/Efeitos sonoros/explosao.wav'));
    const hitSound = new Audio(encodeURI('/galaxy/assets/Audio/Efeitos sonoros/colisao nave.wav'));

    let p, bullets, enemies, explosions, score = 0, highScore = 10000, lives = 3;
    let gameState = 'MENU'; // MENU, PLAYING, GAMEOVER
    let keys = { u: false, d: false, l: false, r: false, fire: false };
    let stars = [];
    let autoFire = true;
    let fireTimer = 0;

    // Estrelas Galaga no Fundo
    for (let i = 0; i < 70; i++) {
      stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        spd: Math.random() * 2 + 1,
        color: ['#fff', '#ff0055', '#00f2fe', '#ffff00'][Math.floor(Math.random() * 4)],
        size: Math.random() * 2 + 1
      });
    }

    function updateLivesHUD() {
      livesDisplay.innerHTML = '';
      for (let i = 0; i < lives; i++) {
        const img = document.createElement('img');
        img.src = heartFullSrc;
        livesDisplay.appendChild(img);
      }
    }

    function resetGame() {
      p = { x: canvas.width / 2 - 20, y: canvas.height - 65, w: 40, h: 40, spd: 5.5 };
      bullets = [];
      enemies = [];
      explosions = [];
      score = 0;
      lives = 3;
      scoreVal.textContent = '0000';
      updateLivesHUD();
    }

    function triggerExplosion(x, y, size = 48) {
      try { boomSound.cloneNode(true).play().catch(() => {}); } catch(e){}
      explosions.push({ x, y, size, frame: 0, timer: 0 });
    }

    function shoot() {
      try { shootSound.cloneNode(true).play().catch(() => {}); } catch(e){}
      // Tiro Duplo Estilo Galaga
      bullets.push({ x: p.x + 8, y: p.y, w: 4, h: 14, v: 9 });
      bullets.push({ x: p.x + p.w - 12, y: p.y, w: 4, h: 14, v: 9 });
    }

    function spawnFormation() {
      if (Math.random() < 0.04) {
        const isLarge = Math.random() > 0.5;
        enemies.push({
          x: Math.random() * (canvas.width - 40),
          y: -40,
          w: isLarge ? 38 : 26,
          h: isLarge ? 38 : 26,
          img: isLarge ? meteorLargeImg : meteorSmallImg,
          vx: (Math.random() - 0.5) * 2,
          vy: Math.random() * 2 + 2,
          hp: isLarge ? 2 : 1
        });
      }
    }

    function update() {
      // Estrelas
      stars.forEach(st => {
        st.y += st.spd;
        if (st.y > canvas.height) { st.y = 0; st.x = Math.random() * canvas.width; }
      });

      if (gameState !== 'PLAYING') return;

      // Movimentação
      if (keys.l && p.x > 5) p.x -= p.spd;
      if (keys.r && p.x < canvas.width - p.w - 5) p.x += p.spd;
      if (keys.u && p.y > 10) p.y -= p.spd;
      if (keys.d && p.y < canvas.height - p.h - 10) p.y += p.spd;

      // Disparo Automático / Manual
      fireTimer++;
      if (autoFire && fireTimer % 14 === 0) shoot();
      else if (!autoFire && keys.fire && fireTimer % 12 === 0) shoot();

      spawnFormation();

      // Projéteis
      bullets.forEach((b, bi) => {
        b.y -= b.v;
        enemies.forEach((e, ei) => {
          if (b.x < e.x + e.w && b.x + b.w > e.x && b.y < e.y + e.h && b.y + b.h > e.y) {
            bullets.splice(bi, 1);
            e.hp--;
            if (e.hp <= 0) {
              triggerExplosion(e.x + e.w / 2, e.y + e.h / 2, e.w * 1.5);
              enemies.splice(ei, 1);
              score += 100;
              scoreVal.textContent = String(score).padStart(4, '0');
              if (score > highScore) {
                highScore = score;
                highScoreVal.textContent = String(highScore).padStart(4, '0');
              }
            }
          }
        });
      });
      bullets = bullets.filter(b => b.y > -20);

      // Inimigos
      enemies.forEach((e, ei) => {
        e.y += e.vy;
        e.x += e.vx;
        if (e.x <= 0 || e.x >= canvas.width - e.w) e.vx *= -1;

        if (e.y > canvas.height) enemies.splice(ei, 1);

        // Colisão com Jogador
        if (p.x < e.x + e.w && p.x + p.w > e.x && p.y < e.y + e.h && p.y + p.h > e.y) {
          triggerExplosion(e.x + e.w / 2, e.y + e.h / 2, 50);
          enemies.splice(ei, 1);
          lives--;
          updateLivesHUD();
          try { hitSound.cloneNode(true).play().catch(() => {}); } catch(e){}
          if (lives <= 0) gameOver();
        }
      });

      // Explosões
      explosions.forEach((exp, i) => {
        exp.timer++;
        if (exp.timer % 3 === 0) {
          exp.frame++;
          if (exp.frame >= explosionFrames.length) explosions.splice(i, 1);
        }
      });
    }

    function draw() {
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Estrelas Pixeladas
      stars.forEach(st => {
        ctx.fillStyle = st.color;
        ctx.fillRect(st.x, st.y, st.size, st.size);
      });

      if (gameState === 'PLAYING') {
        // Nave
        if (playerShipImg.complete && playerShipImg.naturalWidth > 0) {
          ctx.drawImage(playerShipImg, p.x, p.y, p.w, p.h);
        } else {
          ctx.fillStyle = '#00f2fe';
          ctx.fillRect(p.x, p.y, p.w, p.h);
        }

        // Tiros Retrô Amarelos/Neon
        ctx.fillStyle = '#ffff00';
        bullets.forEach(b => {
          ctx.fillRect(b.x, b.y, b.w, b.h);
        });

        // Obstáculos / Naves
        enemies.forEach(e => {
          if (e.img.complete && e.img.naturalWidth > 0) {
            ctx.drawImage(e.img, e.x, e.y, e.w, e.h);
          } else {
            ctx.fillStyle = '#ff0055';
            ctx.fillRect(e.x, e.y, e.w, e.h);
          }
        });

        // Animação da Explosão
        explosions.forEach(exp => {
          const fr = explosionFrames[exp.frame];
          if (fr && fr.complete && fr.naturalWidth > 0) {
            ctx.drawImage(fr, exp.x - exp.size / 2, exp.y - exp.size / 2, exp.size, exp.size);
          }
        });
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    function startGame() {
      resetGame();
      gameState = 'PLAYING';
      startScreen.classList.add('hidden');
      gameOverScreen.classList.add('hidden');
      try { bgMusic.play().catch(() => {}); } catch(e){}
    }

    async function gameOver() {
      gameState = 'GAMEOVER';
      try { bgMusic.pause(); } catch(e){}
      const earnedCoins = Math.floor(score / 5);
      const earnedXp = Math.floor(score / 4);

      finalScoreTxt.textContent = `PONTUAÇÃO: ${score}`;
      rewardTxt.textContent = `🪙 +${earnedCoins} NATASHACOINS | ⭐ +${earnedXp} XP`;
      gameOverScreen.classList.remove('hidden');

      if (discordUserId && discordUserId !== 'guest' && score > 0) {
        try {
          await fetch('/api/score', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ userId: discordUserId, score: Math.floor(score / 5) }),
          });
        } catch (e) {}
      }
    }

    // Controles Touch (Arrastar a nave na tela)
    let isTouching = false;
    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      isTouching = true;
      if (gameState === 'PLAYING') {
        const touch = e.touches[0];
        const rect = canvas.getBoundingClientRect();
        p.x = ((touch.clientX - rect.left) / rect.width) * canvas.width - p.w / 2;
      }
    }, { passive: false });

    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      if (gameState === 'PLAYING' && isTouching) {
        const touch = e.touches[0];
        const rect = canvas.getBoundingClientRect();
        p.x = ((touch.clientX - rect.left) / rect.width) * canvas.width - p.w / 2;
      }
    }, { passive: false });

    canvas.addEventListener('touchend', () => { isTouching = false; });

    // Controles Teclado
    window.addEventListener('keydown', (e) => {
      if (['ArrowLeft', 'KeyA'].includes(e.code)) keys.l = true;
      if (['ArrowRight', 'KeyD'].includes(e.code)) keys.r = true;
      if (['ArrowUp', 'KeyW'].includes(e.code)) keys.u = true;
      if (['ArrowDown', 'KeyS'].includes(e.code)) keys.d = true;
      if (e.code === 'Space') {
        if (gameState === 'PLAYING') keys.fire = true;
        else startGame();
      }
    });

    window.addEventListener('keyup', (e) => {
      if (['ArrowLeft', 'KeyA'].includes(e.code)) keys.l = false;
      if (['ArrowRight', 'KeyD'].includes(e.code)) keys.r = false;
      if (['ArrowUp', 'KeyW'].includes(e.code)) keys.u = false;
      if (['ArrowDown', 'KeyS'].includes(e.code)) keys.d = false;
      if (e.code === 'Space') keys.fire = false;
    });

    autoFireBtn.onclick = () => {
      autoFire = !autoFire;
      autoFireBtn.textContent = autoFire ? '⚡ TIRO: AUTO' : '⚡ TIRO: MANUAL';
    };

    playBtn.onclick = startGame;
    restartBtn.onclick = startGame;

    resetGame();
    loop();
  </script>
</body>
</html>
